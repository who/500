# Manual production deploy. Nothing runs on push.
#
# Required repo secret:
#   RAILWAY_TOKEN — project token for Railway project "five-hundred"
#   Railway → project Settings → Tokens → New project token
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# Then: Actions → Deploy to Railway → Run workflow.
name: Deploy to Railway

"on":
  workflow_dispatch:
    inputs:
      service:
        description: Railway service to upload this checkout to
        type: choice
        required: true
        default: five-hundred
        options:
          - five-hundred
          - learner
          - both

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: 4c5c501b-5450-444f-81ea-f65588801a53
  RAILWAY_ENVIRONMENT_ID: 9f5a788a-052e-404e-8b7b-ef3c562ac297
  FIVE_HUNDRED_SERVICE_ID: f9819cce-f49b-427e-bf5b-5fa9f071bc7c
  LEARNER_SERVICE_ID: 6be96b66-6413-4415-85eb-7bf1945e4b23
  GAME_HEALTHZ: https://five-hundred-production.up.railway.app/healthz

jobs:
  deploy:
    name: Deploy ${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - name: Require RAILWAY_TOKEN
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing repo secret RAILWAY_TOKEN."
            echo "Create a Railway project token for five-hundred and add it under"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy five-hundred
        if: ${{ inputs.service == 'five-hundred' || inputs.service == 'both' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$FIVE_HUNDRED_SERVICE_ID" \
            -m "gha ${GITHUB_SHA} (${GITHUB_REF_NAME})"

      - name: Deploy learner
        if: ${{ inputs.service == 'learner' || inputs.service == 'both' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$LEARNER_SERVICE_ID" \
            -m "gha ${GITHUB_SHA} (${GITHUB_REF_NAME})"

      - name: Wait for five-hundred /healthz
        if: ${{ inputs.service == 'five-hundred' || inputs.service == 'both' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$GAME_HEALTHZ" | grep -q '"status":"ok"'; then
              echo "healthz ok on attempt $i"
              curl -fsS "$GAME_HEALTHZ"
              echo
              exit 0
            fi
            echo "healthz not ready (attempt $i/30); sleeping 5s"
            sleep 5
          done
          echo "five-hundred /healthz did not become ok"
          exit 1
